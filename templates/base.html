<!DOCTYPE html>
<html lang="ru">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>{% block title %}My Garden{% endblock %}</title>

    <link rel="preconnect" href="https://fonts.googleapis.com">
    <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
    <link href="https://fonts.googleapis.com/css2?family=Press+Start+2P&display=swap" rel="stylesheet">

    <link rel="stylesheet" href="{{ url_for('static', filename='css/style.css') }}">
</head>
<body>
    <header class="site-header">
        <a class="logo pixel-text" href="{{ url_for('main.index') }}">
            My Garden
        </a>

        <nav class="pixel-nav">
            <a href="{{ url_for('main.index') }}">Главная</a>
            <a href="{{ url_for('main.login') }}">Личный кабинет</a>
        </nav>
    </header>

    <main class="container">
        {% block content %}{% endblock %}
    </main>

    <footer class="site-footer">
        <p>
            <span class="pixel-text">My Garden</span>
            — проект находится в разработке
        </p>
    </footer>
</body>
</html>
